name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atc
          POSTGRES_PASSWORD: atc
          POSTGRES_DB: atc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ATC_DATABASE_URL: postgresql+psycopg://atc:atc@localhost:5432/atc_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Typecheck
        run: .venv/bin/mypy src
      - name: Tests
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build

  client-freshness:
    name: Generated client is in sync with the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          cd apps/api && uv venv .venv && uv pip install -e "."
          cd ../.. && pnpm install --frozen-lockfile
      - name: Regenerate schema + client
        run: |
          cd apps/api && PYTHONPATH=src .venv/bin/python scripts/export_openapi.py > ../../packages/schemas/openapi.json
          cd ../.. && pnpm client:generate
      - name: Fail on drift
        run: git diff --exit-code packages/
