# Development dependencies only. The api/web/worker run on the host
# (`make api`, `make worker`, `make web`) for fast reload; containers for
# them exist in apps/*/Dockerfile and are used by staging/production.
name: atc

services:
  postgres:
    image: pgvector/pgvector:pg16 # pgvector ships now so M1 needs no image swap
    environment:
      POSTGRES_USER: atc
      POSTGRES_PASSWORD: atc
      POSTGRES_DB: atc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/atc-documents;
      exit 0"

volumes:
  pgdata:
  miniodata:
